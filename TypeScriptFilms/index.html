<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" /> 
    <link rel="stylesheet" href="app.css" type="text/css" />   
</head>
<body style="background-color:lemonchiffon">
    <h1 style="display:flex;justify-content:center;">Movies</h1>

    <div style="display: flex; justify-content: center; padding: 50px;padding-top:0">
        <div style=" padding: 50px; background-color:sandybrown">
            <input type="text" id="name" name="name" /><br />
            <select id="typeMove" name="typeMove">
                <option value="movie">movie</option>
                <option value="series">series</option>
                <option value="episode">episode</option>
            </select>&nbsp;&nbsp;
            <input type="button" id="search" name="search" value="search" />
        </div>
    </div>
    <div id="err" style="display: none; justify-content: center;color:red;font-size:1.5em;">Not found</div>
    <div style="display: flex; justify-content: center;" id="content">
    </div>
    <hr />   
    <div style="display:flex;justify-content: center; padding:30px;" id="content1">
        <div id="con" style="display: none; background-color: sandybrown; padding: 10px;">
            <img id="im" name="im" width="400" max-height="100%" alt="Poster" />
        </div>
        <div style="display: none;" id="con1">
            <div style="padding:15px;">
                <span style="font-style:normal">name:&nbsp;&nbsp;</span> <span name="n" id="n" style="padding:15px"></span><br />
                <span style="font-style:normal">year:&nbsp;&nbsp;</span> <span name="y" id="y" style="padding:15px"></span><br />
                <span style="font-style:normal">genre:&nbsp;&nbsp;</span><span name="g" id="g" style="padding:15px"></span><br />
                <span style="font-style:normal">actors:&nbsp;&nbsp;</span><span name="a" id="a" style="padding:15px"></span><br />
                <span style="font-style:normal">director:&nbsp;&nbsp;</span><span name="d" id="d" style="padding:15px"></span><br />
                <span style="font-style:normal">writer:&nbsp;&nbsp;</span><span name="w" id="w" style="padding:15px"></span><br />
                <span style="font-style:normal">country:&nbsp;&nbsp;</span><span name="c" id="c" style="padding:15px"></span><br />
                <span style="font-style:normal">rating:&nbsp;&nbsp;</span><span name="r" id="r" style="padding:30px"></span><br />
            </div>
            <p name="p" id="p" style="width:300px; padding:15px;"></p>
        </div>
    </div>
    <hr />
<footer> Movies Search-2023</footer>
    <script src="Scripts/jquery-3.7.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
